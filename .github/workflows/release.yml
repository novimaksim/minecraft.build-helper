name: Release mod

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute next version
        id: version
        run: |
          git fetch --tags --force
          LAST=$(git tag --sort=-v:refname --merged | grep -E '^v?[0-9]+\.[0-9]+' | head -n1 || true)
          if [ -z "$LAST" ]; then
            NEXT="1.0"
          else
            BASE="${LAST#v}"
            MAJOR="${BASE%%.*}"
            MINOR="${BASE##*.}"
            if [ "$MINOR" = "$BASE" ]; then
              MINOR="0"
            fi
            MINOR=$((MINOR + 1))
            if [ "$MINOR" -eq 1000 ]; then
              MAJOR=$((MAJOR + 1))
              MINOR=0
            fi
            NEXT="${MAJOR}.${MINOR}"
          fi
          echo "NEXT_VERSION=${NEXT}"
          echo "next-version=${NEXT}" >> "$GITHUB_OUTPUT"

      - name: Show computed version
        run: echo "Будет выпущена версия ${{ steps.version.outputs.next-version }}"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 7.6.4
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '7.6.4'

      - name: Build
        id: build
        working-directory: mod
        run: gradle build --no-daemon -Pproject_version="${{ steps.version.outputs.next-version }}"

      - name: Generate release notes
        shell: bash
        run: |
          NEXT="${{ steps.version.outputs.next-version }}"
          : > release_notes.md
          echo "Новая версия: ${NEXT}" >> release_notes.md
          echo "" >> release_notes.md
          echo "### Изменения" >> release_notes.md
          git log --no-merges --pretty=format:"- %s (\`%h\`)" >> release_notes.md
          echo "" >> release_notes.md

      - name: Create GitHub release with jar
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.version.outputs.next-version }}
          tag_name: ${{ steps.version.outputs.next-version }}
          files: mod/build/libs/*.jar
          body_path: release_notes.md
          generate_release_notes: true
          fail_on_unmatched_files: true