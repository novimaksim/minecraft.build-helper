plugins { id 'net.minecraftforge.gradle' version '[5.1,5.2)'; id 'eclipse'; id 'maven-publish' }
version = project.findProperty('project_version') ?: '1.0.0'
group = 'ru.avganbaev.sevenstarsbuilder'
base { archivesName = 'sevenstars-builder-1.19.2' }
java.toolchain.languageVersion = JavaLanguageVersion.of(17)
minecraft { mappings channel: 'official', version: '1.19.2'; runs { client { workingDirectory project.file('run'); property 'forge.logging.console.level', 'debug'; mods { sevenstars_builder { source sourceSets.main } } } } }
repositories { mavenCentral() }
dependencies { minecraft 'net.minecraftforge:forge:1.19.2-43.4.16' }
tasks.named('jar', Jar).configure { manifest { attributes(['Specification-Title':'SevenStars Builder','Specification-Vendor':'Rustem Avganbaev','Specification-Version':'1','Implementation-Title':project.name,'Implementation-Version':project.jar.archiveVersion]) }; finalizedBy 'reobfJar' }
